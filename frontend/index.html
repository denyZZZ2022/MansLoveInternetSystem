<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Task Manager</h1>
  </header>

  <main class="container">
    <section class="card form-panel">
      <h2>Nowe zadanie</h2>
      <form id="task-form" novalidate>
        <div class="field">
          <label for="title">Tytuł</label>
          <input id="title" name="title" type="text" required maxlength="100">
        </div>
        <div class="field">
          <label for="description">Opis</label>
          <textarea id="description" name="description" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="new">Nowe</option>
            <option value="in_progress">W trakcie</option>
            <option value="done">Zakończone</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Dodaj zadanie</button>
      </form>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <section class="list-panel">
      <h2>Lista zadań</h2>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
